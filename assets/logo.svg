<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fcff"/><stop offset="1" stop-color="#d3ecfa"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ce8ee"/><stop offset="1" stop-color="#3fb0d8"/>
    </linearGradient>
    <clipPath id="c"><circle cx="128" cy="128" r="126"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- snow dots & music notes -->
    <g stroke="#bfe3f5" stroke-width="3" stroke-linecap="round">
      <path d="M44 66 v16 M36 74 h16 M38 68 l12 12 M50 68 l-12 12"/>
      <path d="M212 96 v12 M206 102 h12 M208 98 l8 8 M216 98 l-8 8"/>
    </g>
    <path d="M206 44 a6 6 0 1 0 6 6 v-20 l10 4 v6 l-10 -4 z" fill="#4a90c2"/>
    <path d="M64 34 a5 5 0 1 0 5 5 v-16 l8 3 v5 l-8 -3 z" fill="#7fb8dc" opacity="0.9"/>
    <!-- long hair back -->
    <path d="M128 34 C82 34 58 66 56 104 C54 138 60 168 50 196 C46 208 40 216 34 222 C58 230 82 224 96 210 C112 196 144 196 160 210 C174 224 198 230 222 222 C216 216 210 208 206 196 C196 168 202 138 200 104 C198 66 174 34 128 34 Z" fill="url(#hair)" stroke="#35405a" stroke-width="3"/>
    <!-- face -->
    <circle cx="128" cy="118" r="58" fill="#ffe9da" stroke="#35405a" stroke-width="3"/>
    <!-- fringe: side-swept rounded locks -->
    <path d="M70 116 C70 74 96 50 128 50 C160 50 186 74 186 116 C178 104 172 100 166 110 C162 92 152 88 146 102 C140 86 128 86 122 100 C114 88 104 90 98 104 C92 94 84 98 80 112 C76 104 72 108 70 116 Z" fill="url(#hair)" stroke="#35405a" stroke-width="3"/>
    <path d="M92 66 C104 56 120 52 134 54" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <!-- side locks front -->
    <path d="M70 112 C66 140 68 164 76 184 C84 176 88 160 88 140 C88 128 84 118 78 110 Z" fill="url(#hair)" stroke="#35405a" stroke-width="3"/>
    <path d="M186 112 C190 140 188 164 180 184 C172 176 168 160 168 140 C168 128 172 118 178 110 Z" fill="url(#hair)" stroke="#35405a" stroke-width="3"/>
    <!-- white flower hairpin, left -->
    <g stroke="#35405a" stroke-width="2.5">
      <circle cx="86" cy="76" r="8" fill="#ffffff"/>
      <circle cx="98" cy="70" r="8" fill="#ffffff"/>
      <circle cx="104" cy="82" r="8" fill="#ffffff"/>
      <circle cx="94" cy="90" r="8" fill="#ffffff"/>
      <circle cx="84" cy="88" r="8" fill="#ffffff"/>
      <circle cx="94" cy="80" r="5.5" fill="#ffd76e"/>
    </g>
    <!-- eyes: hydro azure, double highlight -->
    <ellipse cx="106" cy="124" rx="11" ry="14" fill="#2e86c8" stroke="#35405a" stroke-width="2.5"/>
    <ellipse cx="150" cy="124" rx="11" ry="14" fill="#2e86c8" stroke="#35405a" stroke-width="2.5"/>
    <circle cx="102" cy="119" r="4.2" fill="#ffffff"/>
    <circle cx="146" cy="119" r="4.2" fill="#ffffff"/>
    <circle cx="109" cy="130" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="153" cy="130" r="2" fill="#ffffff" opacity="0.9"/>
    <!-- blush -->
    <ellipse cx="90" cy="140" rx="8.5" ry="5" fill="#ffb1c0" opacity="0.8"/>
    <ellipse cx="166" cy="140" rx="8.5" ry="5" fill="#ffb1c0" opacity="0.8"/>
    <!-- singing mouth -->
    <path d="M120 144 q8 -3 16 0 q-1 12 -8 12 q-7 0 -8 -12 z" fill="#c95b5b" stroke="#35405a" stroke-width="2.5"/>
    <ellipse cx="128" cy="152" rx="4.5" ry="3" fill="#ff9d9d"/>
    <!-- collar: white frill + blue bow -->
    <path d="M96 176 q32 22 64 0 l6 16 q-38 22 -76 0 z" fill="#ffffff" stroke="#35405a" stroke-width="3"/>
    <path d="M128 186 l-14 -8 q-6 8 0 14 z M128 186 l14 -8 q6 8 0 14 z" fill="#8fd0f0" stroke="#35405a" stroke-width="2.5"/>
    <circle cx="128" cy="186" r="4.5" fill="#4a90c2" stroke="#35405a" stroke-width="2.5"/>
  </g>
  <circle cx="128" cy="128" r="124" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
</svg>
